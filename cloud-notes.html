<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cloud Computing Notes | Hoàng Lê Khoa</title><style>:root{color-scheme:dark;font-family:system-ui,Arial;--bg:#080e19;--panel:#101e31;--border:#28415e;--text:#edf4ff;--muted:#a9bed7;--accent:#49aaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#17375c,#080e19 60%);color:var(--text);min-height:100vh}header,main{max-width:1050px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#79c8ff;text-decoration:none}h1{font-size:clamp(26px,4vw,40px);margin:12px 0}p{color:var(--muted);line-height:1.65}.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 15px 35px #0003}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-size:13px;color:#c4d6ed;display:grid;gap:6px}input,select,button{font:inherit;border-radius:10px;padding:11px 12px}input,select{background:#081524;border:1px solid #39516d;color:white;width:100%}button{border:0;background:#348ff2;color:white;cursor:pointer;font-weight:650}button:hover{filter:brightness(1.13)}button.secondary{background:#27435f}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:630px}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid #28415e;font-size:13px}th{color:#8abfe9}td button{padding:6px 10px;font-size:12px;margin:2px}small,.muted{color:var(--muted)}.stat{color:#78d2ff;font-size:24px;font-weight:750}.pill{display:inline-block;border:1px solid #345878;background:#132b44;border-radius:20px;padding:4px 10px;font-size:12px}.notes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.note h3{margin-top:0}.note ul{color:#c7d7ec;line-height:1.9;padding-left:20px}.note footer{display:flex;justify-content:space-between;align-items:center;gap:12px}.hidden{display:none!important}@media(max-width:700px){.grid,.notes{grid-template-columns:1fr}header,main{padding:16px}.panel{padding:16px}}</style></head><body><header><strong>HK / DEV LAB</strong><a href="index.html#projects">← Trở về Portfolio</a></header><main><span class="pill">PERSONAL PRACTICE PROJECT</span><h1>Cloud Computing Notes</h1><p>Thư viện kiến thức nền tảng · Tìm kiếm bài học · Theo dõi tiến độ cá nhân</p><section class="panel"><div class="grid"><label>Tìm chủ đề<input id="search" placeholder="Ví dụ: SaaS, bảo mật, triển khai..."></label><div><small>Đã hoàn thành</small><div class="stat" id="progress">0 / 6</div></div><div><small>Tiến độ</small><div class="stat" id="percent">0%</div></div></div></section><div id="notes" class="notes"></div><p><small>Nội dung là ghi chú học tập cơ bản, không phải chứng chỉ hoặc dự án hạ tầng đã triển khai.</small></p></main><script>const data=[["Cloud Computing là gì?", "Cơ bản", ["Cung cấp tài nguyên tính toán, lưu trữ và phần mềm qua mạng theo nhu cầu.", "Ưu điểm: linh hoạt, mở rộng nhanh và giảm chi phí đầu tư hạ tầng ban đầu.", "Lưu ý: bảo mật, độ trễ, chi phí sử dụng và phụ thuộc nhà cung cấp."]], ["IaaS, PaaS và SaaS", "Mô hình dịch vụ", ["IaaS: thuê máy ảo, mạng và lưu trữ; người dùng quản lý hệ điều hành, ứng dụng.", "PaaS: nền tảng triển khai ứng dụng, nhà cung cấp quản lý phần lớn hạ tầng.", "SaaS: phần mềm sẵn dùng qua web, ví dụ dịch vụ email trực tuyến."]], ["Public, Private và Hybrid Cloud", "Triển khai", ["Public Cloud: tài nguyên từ nhà cung cấp phục vụ nhiều khách hàng.", "Private Cloud: hạ tầng dành riêng cho một tổ chức.", "Hybrid Cloud: kết hợp nhiều môi trường để cân bằng yêu cầu."]], ["Quy trình đưa website lên mạng", "Thực hành", ["Chuẩn bị mã nguồn HTML, CSS và JavaScript; kiểm tra liên kết và responsive.", "Đẩy mã nguồn lên GitHub hoặc GitLab.", "Triển khai bằng GitHub Pages, Netlify hoặc Vercel; kiểm tra đường dẫn công khai."]], ["Bảo mật và sao lưu", "Vận hành", ["Bật HTTPS, bảo vệ tài khoản bằng MFA và phân quyền tối thiểu.", "Không lưu khóa bí mật trong mã nguồn frontend.", "Thiết lập sao lưu và kiểm tra khả năng khôi phục dữ liệu."]], ["Giám sát và chi phí", "Vận hành", ["Theo dõi mức dùng CPU, RAM, băng thông và dung lượng lưu trữ.", "Đặt cảnh báo chi phí và giới hạn tài nguyên khi có thể.", "Tắt tài nguyên thử nghiệm không còn sử dụng."]]];const key='hlk_cloud_notes_v1';let done=[];try{done=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(done))done=[]}catch{done=[]}const root=document.getElementById('notes');function render(){root.replaceChildren();const q=document.getElementById('search').value.toLocaleLowerCase('vi');data.forEach(([title,cat,items],i)=>{if(![title,cat,...items].join(' ').toLocaleLowerCase('vi').includes(q))return;const article=document.createElement('article');article.className='panel note';const tag=document.createElement('span');tag.className='pill';tag.textContent=cat;const h=document.createElement('h3');h.textContent=title;const ul=document.createElement('ul');items.forEach(item=>{const li=document.createElement('li');li.textContent=item;ul.append(li)});const footer=document.createElement('footer');const state=document.createElement('small');state.textContent=done.includes(i)?'✓ Đã học':'Chưa hoàn thành';const btn=document.createElement('button');btn.className=done.includes(i)?'secondary':'';btn.textContent=done.includes(i)?'Đánh dấu chưa học':'Đánh dấu đã học';btn.onclick=()=>{done=done.includes(i)?done.filter(x=>x!==i):[...done,i];localStorage.setItem(key,JSON.stringify(done));render()};footer.append(state,btn);article.append(tag,h,ul,footer);root.append(article)});if(!root.children.length){const p=document.createElement('p');p.textContent='Không tìm thấy chủ đề phù hợp.';root.append(p)}document.getElementById('progress').textContent=done.length+' / '+data.length;document.getElementById('percent').textContent=Math.round(done.length/data.length*100)+'%'}document.getElementById('search').addEventListener('input',render);render();</script></body></html>
